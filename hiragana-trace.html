<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ひらがな なぞりがき れんしゅう（完全オフライン版）</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #fffbeb;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", "Meiryo", sans-serif;
    color: #334155;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 6px 10px 10px;
    gap: 6px;
  }

  /* Mode Switch Tabs */
  .mode-tabs {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .mode-tab {
    flex: 1;
    border: 2px solid #cbd5e1;
    background: #ffffff;
    color: #475569;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 4px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .mode-tab.active {
    background: #f59e0b;
    color: #ffffff;
    border-color: #d97706;
    box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
  }
  .mode-tab:active { transform: scale(0.97); }

  /* Selector Area */
  .selector-panel {
    background: #ffffff;
    border: 2px solid #fde68a;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 2px 6px rgba(245, 158, 11, 0.08);
    flex-shrink: 0;
  }

  /* 50-on Rows */
  .row-tabs {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    margin-bottom: 5px;
  }
  .row-btn {
    border: none;
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, background-color 0.15s;
  }
  .row-btn:active { transform: scale(0.94); }
  .row-btn.active {
    background: #f59e0b;
    color: #ffffff;
    box-shadow: 0 2px 4px rgba(245, 158, 11, 0.35);
  }

  .char-list {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .char-btn {
    flex: 1;
    max-width: 68px;
    height: 36px;
    border: 2px solid #fed7aa;
    background: #fff7ed;
    color: #9a3412;
    font-size: 20px;
    font-weight: 900;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  .char-btn:active { transform: scale(0.94); }
  .char-btn.active {
    background: #fb923c;
    border-color: #ea580c;
    color: #ffffff;
    box-shadow: 0 2px 5px rgba(234, 88, 12, 0.35);
  }
  .char-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #10b981;
    color: white;
    font-size: 10px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #fff;
  }

  /* Word Mode Panel */
  .word-panel {
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .word-panel.visible {
    display: flex;
  }

  .word-presets-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .slide-nav-btn {
    flex-shrink: 0;
    width: 26px;
    height: 34px;
    border: 1.5px solid #fed7aa;
    background: #fff7ed;
    color: #ea580c;
    font-weight: 900;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide-nav-btn:active {
    background: #ffedd5;
    transform: scale(0.94);
  }

  .word-presets {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 4px;
    flex: 1;
    cursor: grab;
    scroll-behavior: smooth;
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .word-presets::-webkit-scrollbar {
    display: none;
  }
  .word-presets.dragging {
    cursor: grabbing;
    scroll-behavior: auto;
  }

  .word-chip {
    flex-shrink: 0;
    border: 2px solid #fed7aa;
    background: #fff7ed;
    color: #9a3412;
    font-size: 14px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .word-chip.active {
    background: #fb923c;
    border-color: #ea580c;
    color: #ffffff;
  }
  .word-custom-open-btn {
    flex-shrink: 0;
    border: 2px dashed #38bdf8;
    background: #f0f9ff;
    color: #0284c7;
    font-size: 13px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }

  .word-progress-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #fefce8;
    border: 1.5px solid #fef08a;
    border-radius: 10px;
    padding: 4px 8px;
  }
  .word-step-char {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    color: #94a3b8;
    border: 2px solid #cbd5e1;
  }
  .word-step-char.done {
    background: #dcfce7;
    color: #15803d;
    border-color: #22c55e;
  }
  .word-step-char.current {
    background: #fef08a;
    color: #b45309;
    border-color: #f59e0b;
    transform: scale(1.1);
    box-shadow: 0 2px 4px rgba(245, 158, 11, 0.25);
  }
  .word-step-arrow {
    color: #cbd5e1;
    font-weight: 900;
    font-size: 12px;
  }

  /* Main Canvas Wrapper */
  .board-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .board-square {
    position: relative;
    background: #ffffff;
    border: 4px solid #fcd34d;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(245, 158, 11, 0.14);
    overflow: hidden;
    touch-action: none;
  }

  /* Grid crosshairs inside board */
  .grid-line-h {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 0;
    border-top: 2px dashed #e2e8f0;
    pointer-events: none;
  }
  .grid-line-v {
    position: absolute;
    left: 50%;
    top: 0;
    width: 0;
    height: 100%;
    border-left: 2px dashed #e2e8f0;
    pointer-events: none;
  }

  /* Top status pills inside board */
  .board-hud {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 15;
  }
  .hud-pill {
    background: rgba(255, 255, 255, 0.92);
    border: 2px solid #fde68a;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 800;
    color: #b45309;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .hud-pill.stroke-info {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1d4ed8;
  }

  /* Layers inside square board */
  #guide-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  #done-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
    opacity: 0.35; /* 書き終わった線は薄く表示 */
  }
  #draw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 6; /* 書いている途中の線を最前面に */
    cursor: crosshair;
  }

  #checkpoint-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 8; /* 書いている途中の線(z-index: 6)より上に表示 */
  }
  /* Guide pulsing marker */
  @keyframes pulseMarker {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }
  .pulse-group {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseMarker 1.1s infinite ease-in-out;
  }

  /* Clear Stamp Overlay (Click to advance) */
  .clear-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    cursor: pointer;
  }
  .clear-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  @keyframes stampPop {
    0% { transform: scale(2.4) rotate(-18deg); opacity: 0; }
    65% { transform: scale(0.92) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .hanamaru-svg {
    width: 58%;
    max-width: 240px;
    height: auto;
    filter: drop-shadow(0 6px 12px rgba(239, 68, 68, 0.35));
  }
  .clear-overlay.show .hanamaru-svg {
    animation: stampPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .clear-msg {
    margin-top: 6px;
    background: #ef4444;
    color: #ffffff;
    font-size: 18px;
    font-weight: 900;
    padding: 6px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(239, 68, 68, 0.35);
  }
  .tap-next-hint {
    margin-top: 10px;
    background: #ffffff;
    color: #b45309;
    border: 2px solid #f59e0b;
    font-size: 14px;
    font-weight: 800;
    padding: 5px 16px;
    border-radius: 999px;
    animation: pulseMarker 1.2s infinite ease-in-out;
  }

  /* Word Complete Celebration Modal */
  .word-complete-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 251, 235, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    cursor: pointer;
  }
  .word-complete-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .word-complete-title {
    font-size: 22px;
    font-weight: 900;
    color: #ea580c;
    margin-bottom: 12px;
    text-align: center;
  }
  .word-result-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #ffffff;
    border: 3px solid #fb923c;
    border-radius: 20px;
    padding: 12px 14px;
    box-shadow: 0 6px 16px rgba(234, 88, 12, 0.18);
    max-width: 100%;
    flex-wrap: wrap;
  }
  .word-result-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .word-result-img {
    width: 68px;
    height: 68px;
    border: 2px solid #fed7aa;
    border-radius: 12px;
    background: #fffbeb;
    object-fit: contain;
  }
  .word-result-label {
    font-size: 18px;
    font-weight: 900;
    color: #9a3412;
  }

  /* Custom Word Builder Modal */
  .builder-modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 50;
  }
  .builder-modal.open {
    display: flex;
  }
  .builder-card {
    background: #ffffff;
    border-radius: 22px;
    border: 3px solid #38bdf8;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  }
  .builder-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 900;
    color: #0369a1;
  }
  .builder-close {
    border: none;
    background: #f1f5f9;
    color: #475569;
    font-weight: 900;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
  }
  .builder-display {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f0f9ff;
    border: 2px solid #bae6fd;
    border-radius: 14px;
    padding: 8px 12px;
    min-height: 52px;
  }
  .builder-word-text {
    font-size: 26px;
    font-weight: 900;
    color: #0c4a6e;
    letter-spacing: 4px;
  }
  .builder-word-placeholder {
    font-size: 14px;
    color: #64748b;
    font-weight: 700;
  }
  .builder-backspace {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .builder-keyboard {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    overflow-y: auto;
    padding: 2px;
  }
  .kb-key {
    aspect-ratio: 1 / 1;
    border: 1.5px solid #cbd5e1;
    background: #f8fafc;
    color: #1e293b;
    font-size: 16px;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .kb-key:active {
    background: #bae6fd;
    transform: scale(0.92);
  }
  .kb-key.empty {
    visibility: hidden;
  }
  .builder-actions {
    display: flex;
    gap: 8px;
  }
  .builder-start-btn {
    flex: 1;
    border: none;
    background: #0284c7;
    color: #ffffff;
    font-size: 16px;
    font-weight: 900;
    padding: 12px;
    border-radius: 14px;
    cursor: pointer;
  }
  .builder-start-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }

  /* Bottom Controls */
  .controls {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 10px 6px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    transition: transform 0.1s;
  }
  .ctrl-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
  }
  .btn-voice {
    background: #e0f2fe;
    color: #0369a1;
  }
  .btn-reset {
    background: #fee2e2;
    color: #b91c1c;
  }
  .btn-next {
    background: #fef08a;
    color: #854d0e;
  }

  /* Confetti Canvas */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app-container">
  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-single" onclick="switchMode('single')">🔤 1もじ れんしゅう</button>
    <button class="mode-tab" id="tab-word" onclick="switchMode('word')">📖 たんご れんしゅう</button>
  </div>

  <!-- Top Selector Panel -->
  <div class="selector-panel">
    <!-- Single Character Selector -->
    <div id="single-panel">
      <div class="row-tabs" id="row-tabs"></div>
      <div class="char-list" id="char-list"></div>
    </div>

    <!-- Word Selector -->
    <div id="word-panel" class="word-panel">
      <div class="word-presets-wrapper">
        <button class="slide-nav-btn" onclick="slideWordPresets(-160)" aria-label="左へスライド">◀</button>
        <div class="word-presets" id="word-presets"></div>
        <button class="slide-nav-btn" onclick="slideWordPresets(160)" aria-label="右へスライド">▶</button>
      </div>
      <div class="word-progress-bar" id="word-progress-bar"></div>
    </div>
  </div>

  <!-- Main Tracing Board -->
  <div class="board-wrapper" id="board-wrapper">
    <div class="board-square" id="board-square">
      <div class="grid-line-h"></div>
      <div class="grid-line-v"></div>

      <div class="board-hud">
        <div class="hud-pill" id="hud-char">「あ」の れんしゅう</div>
        <div class="hud-pill stroke-info" id="hud-stroke">1かくめ / 3かく</div>
      </div>

      <!-- SVG Guide Layer -->
      <svg id="guide-svg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Completed Strokes Canvas (Dimmed) -->
      <canvas id="done-canvas"></canvas>

      <!-- Active Drawing Canvas (Top Layer) -->
      <canvas id="draw-canvas"></canvas>

      <!-- Top Checkpoint Layer (未通過の数字を線より上に表示) -->
      <svg id="checkpoint-svg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Single Char Clear Overlay (Tap to advance) -->
      <div class="clear-overlay" id="clear-overlay" onclick="handleClearOverlayClick()">
        <svg class="hanamaru-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path d="M100,22 C112,8 134,14 136,32 C154,26 170,42 162,58 C180,62 186,84 170,96 C186,108 180,130 162,134 C170,150 154,166 136,160 C134,178 112,184 100,170 C88,184 66,178 64,160 C46,166 30,150 38,134 C20,130 14,108 30,96 C14,84 20,62 38,58 C30,42 46,26 64,32 C66,14 88,8 100,22 Z"
                fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M100,52 C126,52 146,72 146,98 C146,124 124,142 98,142 C74,142 56,124 56,100 C56,78 74,62 96,62 C114,62 128,76 128,94 C128,110 115,122 100,122 C87,122 77,112 77,99 C77,89 85,81 95,81 C103,81 109,87 109,95"
                fill="none" stroke="#ef4444" stroke-width="7.5" stroke-linecap="round"/>
        </svg>
        <div class="clear-msg" id="clear-msg-text">よくできました！</div>
        <div class="tap-next-hint">👆 タップして つぎへ</div>
      </div>

      <!-- Word Complete Overlay -->
      <div class="word-complete-overlay" id="word-complete-overlay" onclick="closeWordComplete()">
        <div class="word-complete-title" id="word-complete-title">🎉「いぬ」かんせい！🎉</div>
        <div class="word-result-strip" id="word-result-strip"></div>
        <div class="tap-next-hint" style="margin-top:16px;">👆 タップして つぎへ</div>
      </div>
    </div>
  </div>

  <!-- Bottom Action Buttons -->
  <div class="controls">
    <button class="ctrl-btn btn-voice" onclick="speakCurrent()">🔊 おと</button>
    <button class="ctrl-btn btn-reset" onclick="resetCurrentChar()">🔄 やりなおす</button>
    <button class="ctrl-btn btn-next" onclick="goNextChar()">つぎへ ➡</button>
  </div>
</div>

<!-- Custom Word Builder Modal -->
<div class="builder-modal" id="builder-modal">
  <div class="builder-card">
    <div class="builder-header">
      <span>✏️ すきな たんご を つくる（6もじまで）</span>
      <button class="builder-close" onclick="closeWordBuilder()">✕</button>
    </div>
    <div class="builder-display">
      <div id="builder-word-view" class="builder-word-placeholder">したの もじを おしてね</div>
      <button class="builder-backspace" onclick="builderBackspace()">⌫ 1もじけす</button>
    </div>
    <div class="builder-keyboard" id="builder-keyboard"></div>
    <div class="builder-actions">
      <button class="builder-start-btn" id="builder-start-btn" onclick="confirmCustomWord()" disabled>この たんごで れんしゅう！</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// 全46文字の正確な筆順SVGパスデータ (KanjiVG 109x109座標系準拠・字形総点検修正版)
// ============================================================================
const HIRAGANA_STROKES = {
  'あ': [

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 2オクターブ分のドレミファソラシド (C5 -> C7)
// 点が足りなくても無理に終わらず、次のレミファソラシドへと連続してつながる
const SCALE_FREQS = [
  523.25, // 0: ド (C5)
  587.33, // 1: レ (D5)
  659.25, // 2: ミ (E5)
  698.46, // 3: ファ (F5)
  783.99, // 4: ソ (G5)
  880.00, // 5: ラ (A5)
  987.77, // 6: シ (B5)
  1046.50,// 7: ド (C6)
  1174.66,// 8: レ (D6)
  1318.51,// 9: ミ (E6)
  1396.91,// 10: ファ (F6)
  1567.98,// 11: ソ (G6)
  1760.00,// 12: ラ (A6)
  1975.53,// 13: シ (B6)
  2093.00 // 14: ド (C7)
];

function playTone(freq, duration = 0.14, type = 'sine', delay = 0, vol = 0.22) {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

// はみ出た時の「ブー」という警告音
function playBuzzerSound() {

// チェックポイント通過ごとにドレミファソラシド…と音階が連続して上がる（高音域でも音程感がはっきりするサイン波を使用）
function playCheckpointNote(globalStep) {
  const noteIdx = Math.min(globalStep, SCALE_FREQS.length - 1);
  // 1オクターブ目(0〜7)はtriangle、2オクターブ目(8以上)は澄んだsine波にすることで高さの違いを明確にする
  const waveType = noteIdx >= 8 ? 'sine' : 'triangle';
  playTone(SCALE_FREQS[noteIdx], 0.20, waveType, 0, 0.25);
}

// Confetti Animation (Built-in Offline)
// ============================================================================
const confettiCanvas = document.getElementById('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiAnimId = null;

function launchConfetti(count = 75) {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  const colors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
  for (let i = 0; i < count; i++) {
    confettiParticles.push({
      x: confettiCanvas.width * (0.2 + Math.random() * 0.6),
      y: confettiCanvas.height * 0.45,
      vx: (Math.random() - 0.5) * 14,
      vy: -6 - Math.random() * 10,
      size: 7 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 14,
      gravity: 0.35
    });
  }
  if (!confettiAnimId) updateConfetti();
}

function updateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rot += p.vrot;
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate((p.rot * Math.PI) / 180);
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    confettiCtx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height + 30);
  if (confettiParticles.length > 0) {
    confettiAnimId = requestAnimationFrame(updateConfetti);
  } else {
    confettiAnimId = null;
  }
}

let isDraggingPresets = false;
function setupWordPresetsSlider() {
  const slider = document.getElementById('word-presets');
  let isDown = false;
  let startX = 0;
  let scrollLeft = 0;

  slider.addEventListener('mousedown', (e) => {
    isDown = true;
    isDraggingPresets = false;
    slider.classList.add('dragging');
    startX = e.pageX - slider.offsetLeft;
    scrollLeft = slider.scrollLeft;
  });

  window.addEventListener('mouseup', () => {
    if (!isDown) return;
    isDown = false;
    slider.classList.remove('dragging');
    setTimeout(() => { isDraggingPresets = false; }, 40);
  });

  slider.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const x = e.pageX - slider.offsetLeft;
    const walk = x - startX;
    if (Math.abs(walk) > 5) {
      isDraggingPresets = true;
      e.preventDefault();
      slider.scrollLeft = scrollLeft - walk * 1.4;
    }
  });

  slider.addEventListener('wheel', (e) => {
    if (e.deltaY !== 0) {
      e.preventDefault();
      slider.scrollLeft += e.deltaY;
    }
  }, { passive: false });
}

// ============================================================================
// Board Sizing & Canvas Management
// ============================================================================
function resizeBoard() {
  const rect = boardWrapper.getBoundingClientRect();
  const size = Math.floor(Math.min(rect.width, rect.height));
  if (size <= 0) return;

  const prevSize = boardSize;
  boardSize = size;
  boardSquare.style.width = `${size}px`;
  boardSquare.style.height = `${size}px`;

  dpr = window.devicePixelRatio || 1;

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = doneCanvas.width;
  tempCanvas.height = doneCanvas.height;
  if (tempCanvas.width > 0 && tempCanvas.height > 0) {
    tempCanvas.getContext('2d').drawImage(doneCanvas, 0, 0);
  }

  [doneCanvas, drawCanvas].forEach(cv => {
    cv.width = size * dpr;
    cv.height = size * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  });

  if (prevSize > 0 && tempCanvas.width > 0) {
    doneCtx.drawImage(tempCanvas, 0, 0, size, size);
  }
}

window.addEventListener('resize', resizeBoard);

// Stroke Loading, Checkpoints Generation & SVG Guide Rendering
// ============================================================================
let strokeBaseNoteStep = 0; // 画開始時点の累積音階ステップ

function loadCharacter(char, shouldSpeak = true) {
  currentChar = char;
  currentStrokeIndex = 0;
  charNoteStep = 0;
  strokeBaseNoteStep = 0;
  isCharCompleted = false;
  isDrawing = false;
  clearOverlay.classList.remove('show');
  wordCompleteOverlay.classList.remove('show');

  if (appMode === 'single') {
    const foundRow = ROWS.findIndex(r => r.chars.includes(char));
    if (foundRow !== -1 && foundRow !== currentRowIndex) {
      currentRowIndex = foundRow;
      renderRowTabs();
    }
    renderCharList();
  } else {
    renderWordProgressBar();
  }

  doneCtx.clearRect(0, 0, boardSize, boardSize);
  drawCtx.clearRect(0, 0, boardSize, boardSize);

  setupStrokeGuide();
  if (shouldSpeak) speakText(char);
}

function setupStrokeGuide() {
  const strokes = HIRAGANA_STROKES[currentChar] || [];
  const total = strokes.length;

  if (appMode === 'word') {
    hudChar.textContent = `「${currentWord}」の「${currentChar}」`;
  } else {
    hudChar.textContent = `「${currentChar}」の れんしゅう`;
  }
  hudStroke.textContent = isCharCompleted
    ? 'かんせい！'
    : `${currentStrokeIndex + 1}かくめ / ${total}かく`;

  guideSvg.innerHTML = '';
  checkpointSvg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  // 1. Completed strokes: faint background guide
  for (let i = 0; i < currentStrokeIndex; i++) {
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', strokes[i]);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#e2e8f0');
    p.setAttribute('stroke-width', '8');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    guideSvg.appendChild(p);
  }

  // 2. Active stroke: sample path + sequential checkpoints + start/goal markers
  if (!isCharCompleted && currentStrokeIndex < total) {
    const activeD = strokes[currentStrokeIndex];

    // 太線ガイド (stroke-width="12.5" -> 半径 6.25)
    const guidePath = document.createElementNS(ns, 'path');
    guidePath.setAttribute('d', activeD);
    guidePath.setAttribute('fill', 'none');
    guidePath.setAttribute('stroke', '#fed7aa');
    guidePath.setAttribute('stroke-width', '12.5');
    guidePath.setAttribute('stroke-linecap', 'round');
    guidePath.setAttribute('stroke-linejoin', 'round');
    guideSvg.appendChild(guidePath);

    const dashPath = document.createElementNS(ns, 'path');
    dashPath.setAttribute('d', activeD);
    dashPath.setAttribute('fill', 'none');
    dashPath.setAttribute('stroke', '#f97316');
    dashPath.setAttribute('stroke-width', '1.4');
    dashPath.setAttribute('stroke-dasharray', '2.5 2.5');
    dashPath.setAttribute('stroke-linecap', 'round');
    guideSvg.appendChild(dashPath);

    // Sample path points
    const len = guidePath.getTotalLength();
    strokePoints = [];
    const numSamples = Math.max(24, Math.ceil(len * 1.5));
    for (let s = 0; s <= numSamples; s++) {
      const pt = guidePath.getPointAtLength((len * s) / numSamples);
      strokePoints.push({ x: pt.x, y: pt.y });
    }

// パス情報を保存（矢印の移動計算用）
    activeGuidePath = guidePath;
    activeGuideLen = len;

    // Build sequential checkpoints (excluding start and exact end)
    checkpoints = [];
    nextCheckpointIdx = 0;
    const numCheckpoints = Math.min(8, Math.max(2, Math.floor(len / 13)));
    for (let c = 1; c <= numCheckpoints; c++) {
      const ratio = c / (numCheckpoints + 1);
      const dist = len * ratio;
      const pt = guidePath.getPointAtLength(dist);
      checkpoints.push({ x: pt.x, y: pt.y, dist: dist, passed: false });
    }

// 小さい数字（①、②…）が上に重なるよう逆順で生成し、未通過は線より上のレイヤーに配置
    const passedGroup = document.createElementNS(ns, 'g');
    passedGroup.setAttribute('id', 'cp-passed-group');
    guideSvg.appendChild(passedGroup);

    const activeCpGroup = document.createElementNS(ns, 'g');
    activeCpGroup.setAttribute('id', 'cp-active-group');
    checkpointSvg.appendChild(activeCpGroup);

    for (let idx = checkpoints.length - 1; idx >= 0; idx--) {
      const cp = checkpoints[idx];
      const itemG = document.createElementNS(ns, 'g');
      itemG.setAttribute('id', `cp-item-${idx}`);

      const dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('id', `cp-dot-${idx}`);
      dot.setAttribute('cx', cp.x);
      dot.setAttribute('cy', cp.y);
      dot.setAttribute('r', '4.0');
      dot.setAttribute('fill', '#fb923c');
      dot.setAttribute('stroke', '#ffffff');
      dot.setAttribute('stroke-width', '0.9');
      itemG.appendChild(dot);

      const numLabel = document.createElementNS(ns, 'text');
      numLabel.setAttribute('id', `cp-text-${idx}`);
      numLabel.setAttribute('x', cp.x);
      numLabel.setAttribute('y', cp.y + 1.85);
      numLabel.setAttribute('text-anchor', 'middle');
      numLabel.setAttribute('fill', '#ffffff');
      numLabel.setAttribute('font-size', '5.4');
      numLabel.setAttribute('font-weight', '900');
      numLabel.textContent = CIRCLED_NUMBERS[idx] || String(idx + 1);
      itemG.appendChild(numLabel);

      activeCpGroup.appendChild(itemG);
    }

    // Start marker & direction arrow
    const startPt = guidePath.getPointAtLength(0);
    const nextPt = guidePath.getPointAtLength(Math.min(6, len));
    const endPt = guidePath.getPointAtLength(len);
    const angle = (Math.atan2(nextPt.y - startPt.y, nextPt.x - startPt.x) * 180) / Math.PI;

    // 最後のゴール丸を二回り大きく（太線幅12.5・半径6.25より少しはみ出る半径7.6）
    const goalCircle = document.createElementNS(ns, 'circle');
    goalCircle.setAttribute('id', 'goal-circle');
    goalCircle.setAttribute('cx', endPt.x);
    goalCircle.setAttribute('cy', endPt.y);
    goalCircle.setAttribute('r', '7.6');
    goalCircle.setAttribute('fill', 'rgba(249, 115, 22, 0.24)');
    goalCircle.setAttribute('stroke', '#f97316');
    goalCircle.setAttribute('stroke-width', '1.6');
    guideSvg.appendChild(goalCircle);

    // Start circle with stroke number
    const startGroup = document.createElementNS(ns, 'g');
    startGroup.setAttribute('class', 'pulse-group');

    const startCircle = document.createElementNS(ns, 'circle');
    startCircle.setAttribute('cx', startPt.x);
    startCircle.setAttribute('cy', startPt.y);
    startCircle.setAttribute('r', '5.8');
    startCircle.setAttribute('fill', '#ef4444');
    startCircle.setAttribute('stroke', '#ffffff');
    startCircle.setAttribute('stroke-width', '1.2');
    startGroup.appendChild(startCircle);

    const startText = document.createElementNS(ns, 'text');
    startText.setAttribute('x', startPt.x);
    startText.setAttribute('y', startPt.y + 2.2);
    startText.setAttribute('text-anchor', 'middle');
    startText.setAttribute('fill', '#ffffff');
    startText.setAttribute('font-size', '6.6');
    startText.setAttribute('font-weight', 'bold');
    startText.textContent = String(currentStrokeIndex + 1);
    startGroup.appendChild(startText);

	guideSvg.appendChild(startGroup);

   // 順番に移動する赤い進行方向矢印（最前面レイヤーの最後に追加して常に一番上に表示）
    const movingArrow = document.createElementNS(ns, 'polygon');
    movingArrow.setAttribute('id', 'moving-dir-arrow');
    movingArrow.setAttribute('points', '-2.5,-2.5 3.2,0 -2.5,2.5');
    movingArrow.setAttribute('fill', '#ef4444');
    movingArrow.setAttribute('stroke', '#ffffff');
    movingArrow.setAttribute('stroke-width', '0.5');
    checkpointSvg.appendChild(movingArrow);
    updateDirectionalArrow();
  }
}

function updateCheckpointVisuals() {
  const passedGroup = document.getElementById('cp-passed-group');
  const activeCpGroup = document.getElementById('cp-active-group');

  // 小さい数字が常に手前に来るよう逆順で走査
  for (let idx = checkpoints.length - 1; idx >= 0; idx--) {
    const cp = checkpoints[idx];
    const dot = document.getElementById(`cp-dot-${idx}`);
    const itemG = document.getElementById(`cp-item-${idx}`);
    if (!dot || !itemG) continue;

    if (cp.passed) {
      dot.setAttribute('fill', '#10b981');
      dot.setAttribute('r', '4.6');
      if (passedGroup && itemG.parentNode !== passedGroup) {
        passedGroup.appendChild(itemG); // 通過済みは線の後ろへ移動
      }
    } else {
      dot.setAttribute('fill', '#fb923c');
      dot.setAttribute('r', '4.0');
      if (activeCpGroup && itemG.parentNode !== activeCpGroup) {
        activeCpGroup.appendChild(itemG); // 未通過は線より上の最前面に維持
      }
    }
  }
}
// 現在の目標ポイント（スタート→①、①→②、②→③…、最後→ゴール）に合わせて赤い矢印を移動・回転させる
function updateDirectionalArrow() {
  const arrow = document.getElementById('moving-dir-arrow');
  if (!arrow || !activeGuidePath || activeGuideLen <= 6) return;

  // 始点距離（スタート地点=0、または直前に通過したチェックポイントの距離）
  const prevDist = nextCheckpointIdx === 0
    ? 0
    : checkpoints[nextCheckpointIdx - 1].dist;

  // 終点距離（次に目指すチェックポイント、すべて通過済みならゴールの距離）
  const targetDist = nextCheckpointIdx < checkpoints.length
    ? checkpoints[nextCheckpointIdx].dist
    : activeGuideLen;

  // 目標の丸の少し手前（または中間地点）に矢印を配置
  const arrowDist = Math.max(
    prevDist + 3.5,
    Math.min((prevDist + targetDist) / 2, targetDist - 5.5)
  );

  const pt = activeGuidePath.getPointAtLength(arrowDist);
  const aheadPt = activeGuidePath.getPointAtLength(Math.min(activeGuideLen, arrowDist + 2.5));
  const behindPt = activeGuidePath.getPointAtLength(Math.max(0, arrowDist - 2.5));
  const angle = (Math.atan2(aheadPt.y - behindPt.y, aheadPt.x - behindPt.x) * 180) / Math.PI;

  arrow.setAttribute('transform', `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
}

// ============================================================================
// Pointer Drawing & Sequential Checkpoint + Strict Goal Validation
// ============================================================================
function getCanvasCoords(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function toSvgCoords(pt) {
  return {
    x: (pt.x / boardSize) * 109,
    y: (pt.y / boardSize) * 109
  };
}

function getStrokeLineWidth() {
  return Math.max(14, boardSize * 0.068);
}

function handlePointerDown(e) {
  if (isCharCompleted) return;
  e.preventDefault();
  ensureAudio();

  const pt = getCanvasCoords(e);
  const svgPt = toSvgCoords(pt);

  const startTarget = strokePoints[0];
  if (startTarget) {
    const distFromStart = Math.hypot(svgPt.x - startTarget.x, svgPt.y - startTarget.y);
    if (distFromStart > 18) {
      return;
    }
  }

  isDrawing = true;
  activePointerPts = [svgPt];
  checkpoints.forEach(cp => (cp.passed = false));
  nextCheckpointIdx = 0;
  charNoteStep = strokeBaseNoteStep; // この画の開始時の音階位置に合わせる
  updateCheckpointVisuals();
  updateDirectionalArrow(); // ← この1行を追加

  const goalCircle = document.getElementById('goal-circle');
  if (goalCircle) {
    goalCircle.setAttribute('fill', 'rgba(249, 115, 22, 0.24)');
    goalCircle.setAttribute('stroke', '#f97316');
  }

  drawCtx.clearRect(0, 0, boardSize, boardSize);
  drawCtx.strokeStyle = '#0284c7';
  drawCtx.lineWidth = getStrokeLineWidth();
  drawCtx.beginPath();
  drawCtx.moveTo(pt.x, pt.y);
  drawCtx.lineTo(pt.x + 0.1, pt.y + 0.1);
  drawCtx.stroke();

  checkSequentialCheckpoints(svgPt);
}

function handlePointerMove(e) {
  if (!isDrawing || isCharCompleted) return;
  e.preventDefault();

  const pt = getCanvasCoords(e);
  const svgPt = toSvgCoords(pt);
  activePointerPts.push(svgPt);

  drawCtx.lineTo(pt.x, pt.y);
  drawCtx.stroke();

  checkSequentialCheckpoints(svgPt);

// ガイド線から大きくはみ出たら「ブー」と鳴らして即やり直し
  let minD = Infinity;
  for (const sp of strokePoints) {
    const d = Math.hypot(svgPt.x - sp.x, svgPt.y - sp.y);
    if (d < minD) minD = d;
  }
  if (minD > 16.5) {
    isDrawing = false;
    playBuzzerSound();
    resetFailedStroke();
    return;
  }
}

function checkSequentialCheckpoints(svgPt) {
  if (nextCheckpointIdx < checkpoints.length) {
    const targetCp = checkpoints[nextCheckpointIdx];
    const dist = Math.hypot(svgPt.x - targetCp.x, svgPt.y - targetCp.y);
    if (dist <= 11.5) {
      targetCp.passed = true;
      // ドレミファソラシド…と画をまたいで音階が連続して上がる
      playCheckpointNote(charNoteStep);
      charNoteStep++;
      nextCheckpointIdx++;
      updateCheckpointVisuals();
      updateDirectionalArrow(); // ← この1行を追加（通過した瞬間に矢印が次の区間へ移動）

      if (nextCheckpointIdx === checkpoints.length) {
        const goalCircle = document.getElementById('goal-circle');
        if (goalCircle) {
          goalCircle.setAttribute('fill', 'rgba(16, 185, 129, 0.35)');
          goalCircle.setAttribute('stroke', '#10b981');
        }
      }
    }
  }
}

function handlePointerUp(e) {
  if (!isDrawing) return;
  isDrawing = false;

  if (evaluateCurrentStroke()) {
    commitStroke();
  } else {
    if (activePointerPts.length > 2) {
      playBuzzerSound(); // 途中で指を離したときも「ブー」音を鳴らす
    }
    resetFailedStroke();
  }
}

// 現在の画の失敗・はみ出し時のリセット処理
function resetFailedStroke() {
  charNoteStep = strokeBaseNoteStep;
  drawCtx.clearRect(0, 0, boardSize, boardSize);
  checkpoints.forEach(cp => (cp.passed = false));
  nextCheckpointIdx = 0;
  updateCheckpointVisuals();
  updateDirectionalArrow(); // ← この1行を追加（やり直し時に矢印をスタート〜①の間に戻す）
  const goalCircle = document.getElementById('goal-circle');
  if (goalCircle) {
    goalCircle.setAttribute('fill', 'rgba(249, 115, 22, 0.24)');
    goalCircle.setAttribute('stroke', '#f97316');
  }
}

function evaluateCurrentStroke() {
  if (activePointerPts.length < 2 || strokePoints.length === 0) return false;

  // 1. 途中のチェックポイントをすべて順番に通過しているか
  const allCheckpointsPassed = checkpoints.every(cp => cp.passed);
  if (!allCheckpointsPassed) return false;

  // 2. 最後のゴール丸(r=7.6)に線が実際に接触しているか厳密判定
  const endTarget = strokePoints[strokePoints.length - 1];
  const STRICT_GOAL_RADIUS = 8.0; // 表示上のゴール丸(r=7.6)の縁に触れればOK
  const tailPts = activePointerPts.slice(-6);
  const touchedGoalStrictly = tailPts.some(
    p => Math.hypot(p.x - endTarget.x, p.y - endTarget.y) <= STRICT_GOAL_RADIUS
  );
  if (!touchedGoalStrictly) return false;

  // 3. ガイド線から大きく外れていないか
  let offTrackCount = 0;
  for (const p of activePointerPts) {
    let minD = Infinity;
    for (const sp of strokePoints) {
      const d = Math.hypot(p.x - sp.x, p.y - sp.y);
      if (d < minD) minD = d;
    }
    if (minD > 19) offTrackCount++;
  }
  const offTrackRatio = offTrackCount / activePointerPts.length;
  if (offTrackRatio > 0.25) return false;

  return true;
}

function commitStroke() {
  // 次の画へ音階ステップを引き継ぐ
  strokeBaseNoteStep = charNoteStep;

  doneCtx.drawImage(drawCanvas, 0, 0, boardSize, boardSize);
  drawCtx.clearRect(0, 0, boardSize, boardSize);

  const strokes = HIRAGANA_STROKES[currentChar] || [];
  currentStrokeIndex++;

  if (currentStrokeIndex >= strokes.length) {
    onCharacterCompleted();
  } else {
    playStrokeSuccessSound();
    setupStrokeGuide();
  }
}

function captureCompletedCharSnapshot() {
  const snap = document.createElement('canvas');
  snap.width = 160;
  snap.height = 160;
  const ctx = snap.getContext('2d');
  ctx.fillStyle = '#fffbeb';
  ctx.fillRect(0, 0, 160, 160);

  const strokes = HIRAGANA_STROKES[currentChar] || [];
  ctx.save();
  ctx.scale(160 / 109, 160 / 109);
  ctx.strokeStyle = '#fde68a';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  strokes.forEach(d => {
    const p2d = new Path2D(d);
    ctx.stroke(p2d);
  });
  ctx.restore();

  ctx.drawImage(doneCanvas, 0, 0, 160, 160);
  return snap.toDataURL('image/png');
}

function onCharacterCompleted() {
  isCharCompleted = true;
  setupStrokeGuide();

  if (appMode === 'single') {
    completedChars.add(currentChar);
    renderCharList();
  } else {
    wordDrawnImages[currentWordCharIdx] = captureCompletedCharSnapshot();
  }

  playCharClearSound();
  launchConfetti(65);
  clearMsgText.textContent = `「${currentChar}」よくできました！`;
  clearOverlay.classList.add('show');
  speakText(`すごい！「${currentChar}」が かけたね！`);
}

function handleClearOverlayClick() {
  if (!isCharCompleted) return;
  clearOverlay.classList.remove('show');

  if (appMode === 'word') {
    const chars = Array.from(currentWord);
    if (currentWordCharIdx + 1 < chars.length) {
      currentWordCharIdx++;
      const nextCh = chars[currentWordCharIdx];
      loadCharacter(nextCh, false);
      speakText(`つぎは、${nextCh}`);
    } else {
      showWordCompleteCelebration();
    }
  } else {
    goNextChar();
  }
}

function showWordCompleteCelebration() {
  playWordClearSound();
  launchConfetti(120);
  wordCompleteTitle.textContent = `🎉「${currentWord}」かんせい！🎉`;
  wordResultStrip.innerHTML = '';

  const chars = Array.from(currentWord);
  chars.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'word-result-item';

    if (wordDrawnImages[idx]) {
      const img = document.createElement('img');
      img.className = 'word-result-img';
      img.src = wordDrawnImages[idx];
      img.alt = ch;
      item.appendChild(img);
    }

    const lbl = document.createElement('div');
    lbl.className = 'word-result-label';
    lbl.textContent = ch;
    item.appendChild(lbl);

    wordResultStrip.appendChild(item);
  });

  wordCompleteOverlay.classList.add('show');
  speakText(`おめでとう！「${currentWord}」が かんせい したよ！`);
}

function closeWordComplete() {
  wordCompleteOverlay.classList.remove('show');
  const idx = WORD_PRESETS.findIndex(p => p.word === currentWord);
  const nextWord = idx !== -1
    ? WORD_PRESETS[(idx + 1) % WORD_PRESETS.length].word
    : WORD_PRESETS[0].word;
  startWordPractice(nextWord);
}

// ============================================================================
// Controls: Reset & Next
// ============================================================================
function resetCurrentChar() {
  loadCharacter(currentChar, true);
}

function goNextChar() {
  if (appMode === 'word') {
    const chars = Array.from(currentWord);
    if (currentWordCharIdx + 1 < chars.length) {
      currentWordCharIdx++;
      loadCharacter(chars[currentWordCharIdx], true);
    } else {
      startWordPractice(currentWord);
    }
    return;
  }

  const rowChars = ROWS[currentRowIndex].chars;
  const idxInRow = rowChars.indexOf(currentChar);
  if (idxInRow >= 0 && idxInRow < rowChars.length - 1) {
    loadCharacter(rowChars[idxInRow + 1], true);
  } else {
    currentRowIndex = (currentRowIndex + 1) % ROWS.length;
    renderRowTabs();
    loadCharacter(ROWS[currentRowIndex].chars[0], true);
  }
}

// Attach Pointer Events
drawCanvas.addEventListener('mousedown', handlePointerDown);
window.addEventListener('mousemove', handlePointerMove);
window.addEventListener('mouseup', handlePointerUp);

drawCanvas.addEventListener('touchstart', handlePointerDown, { passive: false });
drawCanvas.addEventListener('touchmove', handlePointerMove, { passive: false });
window.addEventListener('touchend', handlePointerUp);
window.addEventListener('touchcancel', handlePointerUp);

// Initialize App
renderRowTabs();
renderCharList();
renderWordPresets();
setupWordPresetsSlider();
requestAnimationFrame(() => {
  resizeBoard();
  loadCharacter('あ', false);
});
</script>
