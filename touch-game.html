<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>タッチゲーム（ついし・タッチ パズル）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .gauge-bar {
            transition: width 0.1s linear, background-color 0.2s ease;
        }

        /* ゴール目標サイズを示す外枠（ながおしモード用） */
        .goal-guide-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border: 3px dashed rgba(14, 165, 233, 0.45);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(3.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .is-touching .goal-guide-ring {
            opacity: 1;
        }

        /* 進行度に合わせて大きく広がるエナジーゲージ円（ながおしモード用） */
        .progress-expand-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.45) 15%,
                rgba(56, 189, 248, 0.25) 55%,
                rgba(16, 185, 129, 0.5) 95%,
                rgba(255, 255, 255, 0.8) 100%
            );
            border: 4px solid #10b981;
            box-shadow:
                0 0 20px rgba(16, 185, 129, 0.6),
                inset 0 0 18px rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
            opacity: 0;
            overflow: hidden;
            transition: opacity 0.12s ease;
        }

        @keyframes energy-charge-in {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(0.28); opacity: 0; }
        }

        .inner-energy-wave {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.85);
            opacity: 0;
            pointer-events: none;
        }

        .is-touching .inner-energy-wave-1 {
            animation: energy-charge-in 0.65s infinite ease-in;
        }
        .is-touching .inner-energy-wave-2 {
            animation: energy-charge-in 0.65s infinite ease-in 0.325s;
        }

        @keyframes energy-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.18); }
        }
        .is-touching .progress-expand-ring {
            animation: energy-pulse 0.5s infinite ease-in-out;
        }

        /* キラキラお星さま */
        @keyframes float-star {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(180deg); opacity: 0; }
        }
        .star-particle {
            position: absolute;
            pointer-events: none;
            animation: float-star 0.65s forwards ease-out;
            z-index: 20;
        }

        /* +1 ポップアップ */
        @keyframes score-pop {
            0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
            50% { transform: translate(-50%, -32px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -52px) scale(1); opacity: 0; }
        }
        .score-popup {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            animation: score-pop 0.65s forwards ease-out;
            z-index: 30;
            text-shadow: 0 2px 6px rgba(255, 255, 255, 0.95);
        }

        /* ヒット衝撃波リング */
        @keyframes tap-ring-burst {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.95; border-width: 6px; }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 1px; }
        }
        .tap-burst {
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border-style: solid;
            border-color: #f59e0b;
            pointer-events: none;
            animation: tap-ring-burst 0.45s forwards ease-out;
            z-index: 15;
        }

        /* チャレンジモード：リセット通知バナー */
        @keyframes banner-pop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -65%) scale(0.95); opacity: 0; }
        }
        .stage-banner {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: banner-pop 1.1s forwards ease-out;
            z-index: 40;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-sky-50 h-screen w-screen flex flex-col items-center justify-between p-2 md:p-4 select-none">

    <!-- Header / Mode Selectors -->
    <header class="w-full max-w-lg flex flex-col items-center gap-1.5 mt-0.5 shrink-0">
        <!-- ゲームタイプ切替タブ -->
        <div class="w-full flex bg-sky-200/80 p-1 rounded-2xl border-2 border-sky-300 shadow-inner">
            <button id="tab-hold" onclick="setGameType('hold')" class="flex-1 bg-white text-sky-900 font-black py-1.5 px-2 rounded-xl text-xs md:text-sm shadow transition">
                👆 ながおし
            </button>
            <button id="tab-tap" onclick="setGameType('tap')" class="flex-1 text-sky-800 font-bold py-1.5 px-2 rounded-xl text-xs md:text-sm transition">
                ⚡ タッチでポイント
            </button>
        </div>

        <!-- タイトル＆ルール表示 -->
        <div class="w-full flex justify-between items-center px-1">
            <h1 id="game-title" class="text-sm md:text-lg font-extrabold text-sky-900 tracking-wider flex items-center gap-1">
                🐰 ながおしゲーム
            </h1>
            <div id="rule-badge" class="text-[11px] md:text-xs font-extrabold text-sky-900 bg-sky-200 px-2.5 py-0.5 rounded-full border border-sky-400">
                うごくキャラ を おしつづけよう！
            </div>
        </div>

        <!-- Difficulty Mode Buttons (4段階) -->
        <div class="w-full grid grid-cols-4 gap-1">
            <button id="btn-easy" onclick="setMode('easy')" class="bg-sky-500 text-white font-black py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-sky-600 shadow transition active:scale-95">
                ① かんたん
            </button>
            <button id="btn-normal" onclick="setMode('normal')" class="bg-sky-200 text-sky-900 font-bold py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-sky-300 transition active:scale-95">
                ② ふつう
            </button>
            <button id="btn-hard" onclick="setMode('hard')" class="bg-sky-200 text-sky-900 font-bold py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-sky-300 transition active:scale-95">
                ③ むずかしい
            </button>
            <button id="btn-challenge" onclick="setMode('challenge')" class="bg-rose-100 text-rose-800 font-bold py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-rose-300 transition active:scale-95">
                🔥 チャレンジ
            </button>
        </div>
    </header>

    <!-- Main Game Area -->
    <main id="game-board" class="w-full max-w-lg flex-1 relative bg-white rounded-3xl border-4 border-sky-300 shadow-xl overflow-hidden my-2 flex flex-col p-3 md:p-4">
        
        <!-- 上部：クリアゲージ / スコア / チャレンジ表示 -->
        <div class="w-full flex flex-col items-center gap-1 mb-2 shrink-0">
            <div class="w-full flex justify-between items-center px-1 gap-2">
                <div class="flex items-center gap-1.5">
                    <span id="gauge-label" class="text-xs md:text-sm font-black text-sky-800">パワーゲージ</span>
                    <span id="challenge-level-badge" class="hidden text-[11px] md:text-xs font-black bg-rose-500 text-white px-2 py-0.5 rounded-full shadow-sm">
                        LEVEL 1 / 3
                    </span>
                </div>

                <div class="flex items-center gap-2">
                    <span id="timer-badge" class="hidden text-xs md:text-sm font-black bg-amber-100 text-amber-800 border border-amber-400 px-2.5 py-0.5 rounded-full tabular-nums">
                        ⏱ 0.00びょう
                    </span>
                    <span id="gauge-text" class="text-xs md:text-sm font-black text-sky-600 tabular-nums">0%</span>
                </div>
            </div>
            <div class="w-full h-7 bg-slate-100 rounded-full border-4 border-sky-200 p-0.5 overflow-hidden shadow-inner relative">
                <div id="gauge-bar" class="gauge-bar h-full bg-gradient-to-r from-yellow-400 via-orange-400 to-emerald-400 rounded-full w-0"></div>
            </div>
        </div>

        <!-- 追視・タッチターゲット配置エリア -->
        <div id="play-area-wrapper" class="w-full flex-1 relative overflow-hidden rounded-2xl bg-sky-50/50 border-2 border-dashed border-sky-200">
            <div id="play-area" class="w-full h-full relative cursor-pointer touch-none">
                <!-- ターゲット要素はJSから動的に生成・管理 -->
            </div>

            <!-- チャレンジ（ながおし）レベル間待機オーバーレイ -->
            <div id="level-ready-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-[2px] flex flex-col items-center justify-center p-4 z-50">
                <div class="bg-white border-4 border-rose-400 rounded-3xl p-6 shadow-2xl text-center max-w-xs w-full flex flex-col items-center gap-3">
                    <div class="text-4xl">✨🎉✨</div>
                    <div id="level-clear-title" class="text-xl md:text-2xl font-black text-rose-600">
                        レベル1 クリア！
                    </div>
                    <p id="level-next-desc" class="text-xs md:text-sm font-bold text-slate-600">
                        つぎは スピードアップ！じゅんびはいいかな？
                    </p>
                    <button id="next-level-btn" onclick="startNextChallengeLevel()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-black text-lg md:text-xl py-3.5 px-4 rounded-2xl shadow-lg active:scale-95 transition">
                        レベル2 スタート！ 🚀
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-lg mb-1 flex justify-center items-center px-4 shrink-0">
        <button onclick="initGame()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 px-8 rounded-full shadow-md text-xs md:text-sm flex items-center gap-1 active:scale-95 transition">
            🔄 もういちど やりなおす
        </button>
    </footer>

    <!-- クリアモーダル -->
    <div id="success-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-[99999] p-4">
        <div class="bg-white rounded-3xl p-7 max-w-xs w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 flex flex-col items-center">
            <div class="text-6xl mb-2">🎉</div>
            <h2 class="text-3xl font-extrabold text-sky-800 mb-2">クリアー！</h2>
            <p id="clear-message" class="text-slate-600 mb-3 font-bold">ずっと タッチ できたね！すごい！</p>
            
            <div id="time-result-box" class="hidden w-full bg-amber-50 border-2 border-amber-300 rounded-2xl p-3 mb-5">
                <div class="text-xs font-bold text-amber-700">クリアタイム</div>
                <div id="final-time-text" class="text-2xl font-black text-amber-600 tabular-nums">0.00 びょう</div>
                <div id="best-time-text" class="text-xs font-extrabold text-rose-500 mt-1"></div>
            </div>

            <button onclick="closeModal(); initGame();" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl py-3.5 rounded-2xl shadow-lg transform active:scale-95 transition">
                もういっかいあそぶ
            </button>
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            }
            playChargeBeep(progress) {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const minFreq = 440;
                const maxFreq = 1174.66;
                const freq = minFreq + (maxFreq - minFreq) * (progress / 100);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 0.96, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.04, now + 0.085);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.16, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.085);
            }
            playDrainBeep(progress) {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const minFreq = 330;
                const maxFreq = 987.77;
                const freq = minFreq + (maxFreq - minFreq) * (progress / 100);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 1.04, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(120, freq * 0.90), now + 0.09);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.11, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            }
            playTapHit(score, targetScore) {
                this.init();
                const now = this.ctx.currentTime;
                const ratio = Math.min(1, score / targetScore);
                const baseFreq = 523.25 + ratio * 350;

                [baseFreq, baseFreq * 1.25].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const start = now + i * 0.05;

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, start);

                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.22, start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.14);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.14);
                });
            }
            playLevelUp() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [587.33, 739.99, 880.00];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const start = now + idx * 0.06;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.2, start + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.2);
                });
            }
            playResetBuzz() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(190, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.18);
                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            playClear() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const startTime = now + idx * 0.08;
                    const duration = idx === notes.length - 1 ? 0.55 : 0.25;

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.linearRampToValueAtTime(0.24, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + duration);
                });
            }
        }

        const sounds = new SoundFX();

        const CHARACTERS = ['🐰', '🚗', '🐱', '⭐', '🐥', '🚀', '🐶', '🍎'];

        const MODES = {
            easy:      { speed: 1.8, fillRate: 0.50, decayRate: 0,      tapGoal: 10, targetCount: 1 },
            normal:    { speed: 3.0, fillRate: 0.35, decayRate: 0.0875, tapGoal: 10, targetCount: 1 },
            hard:      { speed: 4.5, fillRate: 0.22, decayRate: 0.055,  tapGoal: 10, targetCount: 1 },
            challenge: { speed: 2.2, fillRate: 1.05, decayRate: 0,      tapGoal: 15, targetCount: 3 }
        };

        const CHALLENGE_HOLD_LEVELS = [
            { level: 1, speed: 2.2, fillRate: 1.35 },
            { level: 2, speed: 3.4, fillRate: 1.05 },
            { level: 3, speed: 4.8, fillRate: 0.72 }
        ];

        const MAX_RING_SCALE = 3.2;

        let gameType = 'hold';
        let currentMode = 'easy';
        let progress = 0;
        // かんたんモード専用：ゲージ自体は減らないが、音程だけ「むずかしい」と同じペースで下がるための仮想レベル
        let easySoundProgress = 0;
        let tapScore = 0;
        let challengeLevel = 1;
        let isTouching = false;
        let isCleared = false;
        let isWaitingNextLevel = false; // チャレンジモードでレベル間のスタートボタン待機中フラグ
        let soundTimer = 0;
        let drainSoundTimer = 0;
        let starSpawnTimer = 0;

        let timerStartTime = null;
        let elapsedSeconds = 0;
        let bestTimeChallengeTap = null;

        let targets = [];

        let pointerX = -999, pointerY = -999;
        let activePointerId = null;

        const playAreaEl = document.getElementById('play-area');
        const gaugeBarEl = document.getElementById('gauge-bar');
        const gaugeTextEl = document.getElementById('gauge-text');
        const gaugeLabelEl = document.getElementById('gauge-label');
        const challengeLevelBadgeEl = document.getElementById('challenge-level-badge');
        const timerBadgeEl = document.getElementById('timer-badge');
        const levelReadyOverlayEl = document.getElementById('level-ready-overlay');

        function setGameType(type) {
            gameType = type;

            const tabHold = document.getElementById('tab-hold');
            const tabTap = document.getElementById('tab-tap');
            const titleEl = document.getElementById('game-title');

            if (type === 'hold') {
                tabHold.className = "flex-1 bg-white text-sky-900 font-black py-1.5 px-2 rounded-xl text-xs md:text-sm shadow transition";
                tabTap.className = "flex-1 text-sky-800 font-bold py-1.5 px-2 rounded-xl text-xs md:text-sm transition";
                titleEl.textContent = "🐰 ながおしゲーム";
            } else {
                tabTap.className = "flex-1 bg-white text-amber-700 font-black py-1.5 px-2 rounded-xl text-xs md:text-sm shadow transition";
                tabHold.className = "flex-1 text-sky-800 font-bold py-1.5 px-2 rounded-xl text-xs md:text-sm transition";
                titleEl.textContent = "⚡ タッチゲーム";
            }

            updateHeaderLabels();
            initGame();
        }

        function setMode(mode) {
            currentMode = mode;
            ['easy', 'normal', 'hard', 'challenge'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    if (m === 'challenge') {
                        btn.className = "bg-rose-500 text-white font-black py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-rose-600 shadow transition active:scale-95";
                    } else {
                        btn.className = "bg-sky-500 text-white font-black py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-sky-600 shadow transition active:scale-95";
                    }
                } else {
                    if (m === 'challenge') {
                        btn.className = "bg-rose-100 text-rose-800 font-bold py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-rose-300 transition active:scale-95";
                    } else {
                        btn.className = "bg-sky-200 text-sky-900 font-bold py-1.5 px-1 rounded-xl text-[11px] md:text-xs border-2 border-sky-300 transition active:scale-95";
                    }
                }
            });

            updateHeaderLabels();
            initGame();
        }

        function updateHeaderLabels() {
            const ruleBadgeEl = document.getElementById('rule-badge');
            const clearMsgEl = document.getElementById('clear-message');

            if (gameType === 'hold') {
                gaugeLabelEl.textContent = "パワーゲージ";
                if (currentMode === 'challenge') {
                    ruleBadgeEl.textContent = "はなすとリセット！3れんぞくクリア！";
                    clearMsgEl.textContent = "レベル1〜3を れんぞくクリア！すごい！";
                } else {
                    ruleBadgeEl.textContent = "うごくキャラ を おしつづけよう！";
                    clearMsgEl.textContent = "ずっと タッチ できたね！すごい！";
                }
            } else {
                gaugeLabelEl.textContent = "ポイント";
                if (currentMode === 'challenge') {
                    ruleBadgeEl.textContent = "タップのみで 15てん タイムアタック！";
                    clearMsgEl.textContent = "すべての キャラを すばやく タッチできたね！";
                } else {
                    ruleBadgeEl.textContent = "うごくキャラ を タッチしよう！";
                    clearMsgEl.textContent = "たくさん タッチ できたね！すごい！";
                }
            }
        }

        function getTargetSizeConfig() {
            if (gameType === 'hold') {
                if (currentMode === 'easy') {
                    return {
                        sizeClasses: "w-[120px] h-[120px] md:w-[144px] md:h-[144px] text-6xl md:text-7xl",
                        approxPx: 120
                    };
                } else if (currentMode === 'normal') {
                    return {
                        sizeClasses: "w-[96px] h-[96px] md:w-[115px] md:h-[115px] text-5xl md:text-6xl",
                        approxPx: 96
                    };
                } else {
                    return {
                        sizeClasses: "w-20 h-20 md:w-24 md:h-24 text-4xl md:text-5xl",
                        approxPx: 80
                    };
                }
            } else {
                if (currentMode === 'hard' || currentMode === 'challenge') {
                    return {
                        sizeClasses: "w-16 h-16 md:w-20 md:h-20 text-3xl md:text-4xl",
                        approxPx: 64
                    };
                } else {
                    return {
                        sizeClasses: "w-20 h-20 md:w-24 md:h-24 text-4xl md:text-5xl",
                        approxPx: 80
                    };
                }
            }
        }

        function createTargetObject(index, totalCount) {
            const el = document.createElement('div');
            const sizeCfg = getTargetSizeConfig();

            const colorClasses = gameType === 'tap'
                ? (currentMode === 'challenge' ? "border-rose-400 bg-rose-50" : "border-amber-400 bg-amber-50")
                : (currentMode === 'challenge' ? "border-rose-400 bg-white" : "border-sky-400 bg-white");

            el.className = `absolute ${sizeCfg.sizeClasses} ${colorClasses} border-4 rounded-full shadow-lg flex items-center justify-center pointer-events-none select-none transition-colors`;
            el.style.zIndex = `${10 + index}`;

            el.innerHTML = `
                <div class="goal-guide-ring"></div>
                <div class="progress-expand-ring">
                    <div class="inner-energy-wave inner-energy-wave-1"></div>
                    <div class="inner-energy-wave inner-energy-wave-2"></div>
                </div>
                <span class="target-emoji relative z-10">${CHARACTERS[index % CHARACTERS.length]}</span>
            `;

            playAreaEl.appendChild(el);

            const areaRect = playAreaEl.getBoundingClientRect();
            const targetW = sizeCfg.approxPx;
            const targetH = sizeCfg.approxPx;
            const maxX = Math.max(0, areaRect.width - targetW);
            const maxY = Math.max(0, areaRect.height - targetH);

            let posX = maxX / 2;
            let posY = maxY / 2;
            if (totalCount > 1) {
                const sliceW = maxX / totalCount;
                posX = sliceW * index + Math.random() * Math.max(0, sliceW - 10);
                posY = Math.random() * maxY;
            }

            const speed = getCurrentSpeed();
            const angle = Math.random() * Math.PI * 2;

            el.style.transform = `translate(${posX}px, ${posY}px)`;

            return {
                el,
                emojiEl: el.querySelector('.target-emoji'),
                progressRingEl: el.querySelector('.progress-expand-ring'),
                posX,
                posY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                lastHitTime: 0
            };
        }

        function getCurrentSpeed() {
            if (gameType === 'hold' && currentMode === 'challenge') {
                return CHALLENGE_HOLD_LEVELS[challengeLevel - 1].speed;
            }
            if (gameType === 'tap' && currentMode === 'challenge') {
                return 3.1;
            }
            return MODES[currentMode].speed;
        }

        function initGame() {
            progress = 0;
            easySoundProgress = 0;
            tapScore = 0;
            challengeLevel = 1;
            isTouching = false;
            isCleared = false;
            isWaitingNextLevel = false;
            activePointerId = null;
            timerStartTime = null;
            elapsedSeconds = 0;
            soundTimer = 0;
            drainSoundTimer = 0;

            levelReadyOverlayEl.classList.add('hidden');

            if (gameType === 'hold' && currentMode === 'challenge') {
                challengeLevelBadgeEl.classList.remove('hidden');
                challengeLevelBadgeEl.textContent = `LEVEL ${challengeLevel} / 3`;
            } else {
                challengeLevelBadgeEl.classList.add('hidden');
            }

            if (gameType === 'tap' && currentMode === 'challenge') {
                timerBadgeEl.classList.remove('hidden');
                timerBadgeEl.textContent = `⏱ 0.00びょう`;
            } else {
                timerBadgeEl.classList.add('hidden');
            }

            playAreaEl.innerHTML = '';
            targets = [];

            const count = (gameType === 'tap' && currentMode === 'challenge') ? MODES.challenge.targetCount : 1;
            const shuffled = [...CHARACTERS].sort(() => Math.random() - 0.5);
            for (let i = 0; i < count; i++) {
                const t = createTargetObject(i, count);
                t.emojiEl.textContent = shuffled[i % shuffled.length];
                targets.push(t);
            }

            updateVisualProgress();
        }

        // チャレンジ（ながおし）でレベル1・2クリア後に次レベル開始ボタンを表示
        function promptNextChallengeLevel(clearedLevel) {
            isWaitingNextLevel = true;
            isTouching = false;
            activePointerId = null;

            const t = targets[0];
            if (t) {
                t.el.classList.remove('is-touching', 'border-emerald-500', 'bg-emerald-100');
                t.el.classList.add('border-rose-400', 'bg-white');
            }

            const nextLevel = clearedLevel + 1;
            const nextIcon = nextLevel === 2 ? '🚀' : '🔥';

            document.getElementById('level-clear-title').textContent = `レベル${clearedLevel} クリア！`;
            document.getElementById('level-next-desc').textContent =
                nextLevel === 2
                    ? "つぎは ちょっと はやくなるよ！"
                    : "いよいよ さいごの レベル3！";
            document.getElementById('next-level-btn').textContent = `レベル${nextLevel} スタート！ ${nextIcon}`;

            sounds.playLevelUp();
            confetti({ particleCount: 55, spread: 60, origin: { y: 0.55 } });
            levelReadyOverlayEl.classList.remove('hidden');
        }

        // 「レベル2 スタート！」「レベル3 スタート！」ボタン押下時の処理
        function startNextChallengeLevel() {
            sounds.init();
            challengeLevel++;
            progress = 0;
            isWaitingNextLevel = false;
            levelReadyOverlayEl.classList.add('hidden');

            challengeLevelBadgeEl.textContent = `LEVEL ${challengeLevel} / 3`;

            const t = targets[0];
            if (t) {
                const newSpeed = getCurrentSpeed();
                const angle = Math.random() * Math.PI * 2;
                t.vx = Math.cos(angle) * newSpeed;
                t.vy = Math.sin(angle) * newSpeed;
                pickNewCharacter(t);
            }

            sounds.playChargeBeep(20);
            updateVisualProgress();
        }

        function showStageBanner(text, colorClass = "bg-rose-500 text-white") {
            const banner = document.createElement('div');
            banner.className = `stage-banner ${colorClass} font-black text-xl md:text-2xl px-5 py-2 rounded-full shadow-xl border-2 border-white`;
            banner.textContent = text;
            playAreaEl.appendChild(banner);
            setTimeout(() => banner.remove(), 1100);
        }

        function pickNewCharacter(targetObj) {
            const used = targets.map(t => t.emojiEl.textContent);
            const candidates = CHARACTERS.filter(c => !used.includes(c));
            const pool = candidates.length > 0 ? candidates : CHARACTERS;
            targetObj.emojiEl.textContent = pool[Math.floor(Math.random() * pool.length)];
        }

        function triggerTapHitEffect(hitCenterX, hitCenterY) {
            const areaRect = playAreaEl.getBoundingClientRect();
            const relX = hitCenterX - areaRect.left;
            const relY = hitCenterY - areaRect.top;

            const burst = document.createElement('div');
            burst.className = 'tap-burst';
            burst.style.left = `${relX}px`;
            burst.style.top = `${relY}px`;
            playAreaEl.appendChild(burst);
            setTimeout(() => burst.remove(), 450);

            const popup = document.createElement('div');
            popup.className = 'score-popup text-2xl md:text-3xl text-amber-500';
            popup.textContent = '+1!';
            popup.style.left = `${relX}px`;
            popup.style.top = `${relY - 15}px`;
            playAreaEl.appendChild(popup);
            setTimeout(() => popup.remove(), 650);

            for (let i = 0; i < 6; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle text-xl';
                star.textContent = i % 2 === 0 ? '⭐' : '✨';
                const angle = (Math.PI * 2 / 6) * i + Math.random() * 0.4;
                const dist = 55 + Math.random() * 35;
                star.style.left = `${relX - 10}px`;
                star.style.top = `${relY - 10}px`;
                star.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                playAreaEl.appendChild(star);
                setTimeout(() => star.remove(), 650);
            }
        }

        function relocateTargetAfterTap(targetObj) {
            const areaRect = playAreaEl.getBoundingClientRect();
            const targetWidth = targetObj.el.offsetWidth || 80;
            const targetHeight = targetObj.el.offsetHeight || 80;
            const maxX = Math.max(0, areaRect.width - targetWidth);
            const maxY = Math.max(0, areaRect.height - targetHeight);

            let newX = targetObj.posX;
            let newY = targetObj.posY;
            for (let attempt = 0; attempt < 12; attempt++) {
                const candX = Math.random() * maxX;
                const candY = Math.random() * maxY;
                const distFromSelf = Math.hypot(candX - targetObj.posX, candY - targetObj.posY);
                const farFromOthers = targets.every(other =>
                    other === targetObj || Math.hypot(candX - other.posX, candY - other.posY) > targetWidth * 0.9
                );
                if (distFromSelf > targetWidth * 1.1 && farFromOthers) {
                    newX = candX;
                    newY = candY;
                    break;
                }
                newX = candX;
                newY = candY;
            }

            targetObj.posX = newX;
            targetObj.posY = newY;

            const speed = getCurrentSpeed();
            const angle = Math.random() * Math.PI * 2;
            targetObj.vx = Math.cos(angle) * speed;
            targetObj.vy = Math.sin(angle) * speed;

            pickNewCharacter(targetObj);
            targetObj.el.style.transform = `translate(${targetObj.posX}px, ${targetObj.posY}px)`;
        }

        function spawnSparkleStar(targetObj) {
            const star = document.createElement('div');
            star.className = 'star-particle text-xl';
            star.textContent = '✨';

            const currentScale = 1 + (MAX_RING_SCALE - 1) * (progress / 100);
            const targetRadius = (targetObj.el.offsetWidth || 80) / 2;
            const ringRadius = targetRadius * currentScale;

            const angle = Math.random() * Math.PI * 2;
            const startDist = ringRadius * 0.9;
            const endDist = targetRadius * 0.6;

            const startX = targetRadius + Math.cos(angle) * startDist - 10;
            const startY = targetRadius + Math.sin(angle) * startDist - 10;
            const tx = Math.cos(angle) * (endDist - startDist);
            const ty = Math.sin(angle) * (endDist - startDist);

            star.style.left = `${startX}px`;
            star.style.top = `${startY}px`;
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);

            targetObj.el.appendChild(star);
            setTimeout(() => star.remove(), 650);
        }

        function triggerClear() {
            isCleared = true;
            isTouching = false;
            activePointerId = null;
            targets.forEach(t => {
                t.el.classList.remove('is-touching', 'bg-emerald-100');
            });
            sounds.playClear();

            const timeResultBox = document.getElementById('time-result-box');
            if (gameType === 'tap' && currentMode === 'challenge') {
                timeResultBox.classList.remove('hidden');
                const finalSec = elapsedSeconds.toFixed(2);
                document.getElementById('final-time-text').textContent = `${finalSec} びょう`;

                const bestTextEl = document.getElementById('best-time-text');
                if (bestTimeChallengeTap === null || elapsedSeconds < bestTimeChallengeTap) {
                    bestTimeChallengeTap = elapsedSeconds;
                    bestTextEl.textContent = `🏆 じこベスト こうしん！`;
                } else {
                    bestTextEl.textContent = `ベストタイム: ${bestTimeChallengeTap.toFixed(2)} びょう`;
                }
            } else {
                timeResultBox.classList.add('hidden');
            }

            setTimeout(() => {
                confetti({ particleCount: 140, spread: 85, origin: { y: 0.5 } });
                document.getElementById('success-modal').classList.remove('opacity-0', 'pointer-events-none');
            }, 200);
        }

        function isPointInTarget(x, y, targetObj) {
            const targetRect = targetObj.el.getBoundingClientRect();
            const centerX = targetRect.left + targetRect.width / 2;
            const centerY = targetRect.top + targetRect.height / 2;
            const radius = targetRect.width / 2;

            return Math.hypot(x - centerX, y - centerY) <= radius;
        }

        function isPointerHittingTarget(targetObj) {
            if (activePointerId === null) return false;
            return isPointInTarget(pointerX, pointerY, targetObj);
        }

        function handleTapModeHit(targetObj) {
            const now = performance.now();
            if (currentMode !== 'challenge' && now - targetObj.lastHitTime < 220) return;
            targetObj.lastHitTime = now;

            if (gameType === 'tap' && currentMode === 'challenge' && timerStartTime === null) {
                timerStartTime = performance.now();
            }

            const config = MODES[currentMode];
            const targetRect = targetObj.el.getBoundingClientRect();
            const centerX = targetRect.left + targetRect.width / 2;
            const centerY = targetRect.top + targetRect.height / 2;

            tapScore++;
            sounds.playTapHit(tapScore, config.tapGoal);
            triggerTapHitEffect(centerX, centerY);
            updateVisualProgress();

            if (tapScore >= config.tapGoal) {
                triggerClear();
            } else {
                relocateTargetAfterTap(targetObj);
            }
        }

        function updateLoop() {
            if (!isCleared && !isWaitingNextLevel) {
                const areaRect = playAreaEl.getBoundingClientRect();

                if (gameType === 'tap' && currentMode === 'challenge' && timerStartTime !== null) {
                    elapsedSeconds = (performance.now() - timerStartTime) / 1000;
                    timerBadgeEl.textContent = `⏱ ${elapsedSeconds.toFixed(2)}びょう`;
                }

                targets.forEach(t => {
                    const targetWidth = t.el.offsetWidth || 80;
                    const targetHeight = t.el.offsetHeight || 80;

                    t.posX += t.vx;
                    t.posY += t.vy;

                    if (t.posX <= 0) { t.posX = 0; t.vx *= -1; }
                    else if (t.posX >= areaRect.width - targetWidth) { t.posX = areaRect.width - targetWidth; t.vx *= -1; }

                    if (t.posY <= 0) { t.posY = 0; t.vy *= -1; }
                    else if (t.posY >= areaRect.height - targetHeight) { t.posY = areaRect.height - targetHeight; t.vy *= -1; }

                    t.el.style.transform = `translate(${t.posX}px, ${t.posY}px)`;
                });

                if (gameType === 'hold') {
                    const t = targets[0];
                    const isHit = isPointerHittingTarget(t);

                    if (isHit) {
                        // 離れていて再タッチした瞬間は、現在のゲージ位置から音程を再スタート
                        if (!isTouching && currentMode === 'easy') {
                            easySoundProgress = progress;
                        }
                        isTouching = true;
                        drainSoundTimer = 0;
                        t.el.classList.add('is-touching', 'border-emerald-500', 'bg-emerald-100');
                        t.el.classList.remove('border-sky-400', 'border-rose-400', 'bg-white');

                        starSpawnTimer++;
                        if (starSpawnTimer % 4 === 0) {
                            spawnSparkleStar(t);
                        }
                    } else {
                        if (isTouching && currentMode === 'challenge' && progress > 0 && progress < 100) {
                            progress = 0;
                            sounds.playResetBuzz();
                            showStageBanner("あ！はなれた！リセット！", "bg-slate-700 text-white");
                        }

                        isTouching = false;
                        t.el.classList.remove('is-touching', 'border-emerald-500', 'bg-emerald-100');
                        t.el.classList.add(currentMode === 'challenge' ? 'border-rose-400' : 'border-sky-400', 'bg-white');
                    }

                    const fillRate = (currentMode === 'challenge')
                        ? CHALLENGE_HOLD_LEVELS[challengeLevel - 1].fillRate
                        : MODES[currentMode].fillRate;

                    const decayRate = MODES[currentMode].decayRate;

                    if (isTouching) {
                        progress = Math.min(100, progress + fillRate);
                        if (currentMode === 'easy') {
                            easySoundProgress = progress;
                        }
                        
                        if (soundTimer % 5 === 0) {
                            sounds.playChargeBeep(progress);
                        }
                        soundTimer++;

                        if (progress >= 100) {
                            if (currentMode === 'challenge' && challengeLevel < 3) {
                                // 次レベル開始ボタンを表示して一旦停止
                                updateVisualProgress();
                                promptNextChallengeLevel(challengeLevel);
                                requestAnimationFrame(updateLoop);
                                return;
                            } else {
                                triggerClear();
                            }
                        }
                    } else {
                        soundTimer = 0;
                        if (currentMode === 'easy') {
                            // かんたんモード：ゲージ自体は減らないが、音は「むずかしい」と同じ速度(0.055)で下がっていく
                            if (easySoundProgress > 0) {
                                easySoundProgress = Math.max(0, easySoundProgress - MODES.hard.decayRate);
                                if (drainSoundTimer % 8 === 0) {
                                    sounds.playDrainBeep(easySoundProgress);
                                }
                                drainSoundTimer++;
                            } else {
                                drainSoundTimer = 0;
                            }
                        } else if (currentMode !== 'challenge' && progress > 0 && decayRate > 0) {
                            progress = Math.max(0, progress - decayRate);
                            if (drainSoundTimer % 8 === 0) {
                                sounds.playDrainBeep(progress);
                            }
                            drainSoundTimer++;
                        } else {
                            drainSoundTimer = 0;
                        }
                    }

                    updateVisualProgress();
                } else {
                    if (currentMode !== 'challenge') {
                        targets.forEach(t => {
                            if (isPointerHittingTarget(t)) {
                                handleTapModeHit(t);
                            }
                        });
                    }
                }
            }

            requestAnimationFrame(updateLoop);
        }

        function updateVisualProgress() {
            const config = MODES[currentMode];

            if (gameType === 'hold') {
                const t = targets[0];
                if (!t) return;

                gaugeBarEl.style.width = `${progress}%`;
                gaugeTextEl.textContent = `${Math.floor(progress)}%`;

                if (progress > 0 && !isCleared) {
                    t.progressRingEl.style.opacity = '1';
                    const currentScale = 1 + (MAX_RING_SCALE - 1) * (progress / 100);
                    t.progressRingEl.style.transform = `translate(-50%, -50%) scale(${currentScale})`;

                    if (progress < 40) {
                        t.progressRingEl.style.borderColor = '#facc15';
                        t.progressRingEl.style.background = 'radial-gradient(circle, rgba(255,255,255,0.4) 15%, rgba(250,204,21,0.22) 60%, rgba(250,204,21,0.48) 100%)';
                        t.progressRingEl.style.boxShadow = '0 0 16px rgba(250, 204, 21, 0.6), inset 0 0 14px rgba(255,255,255,0.7)';
                    } else if (progress < 80) {
                        t.progressRingEl.style.borderColor = '#fb923c';
                        t.progressRingEl.style.background = 'radial-gradient(circle, rgba(255,255,255,0.45) 15%, rgba(251,146,60,0.25) 60%, rgba(251,146,60,0.52) 100%)';
                        t.progressRingEl.style.boxShadow = '0 0 20px rgba(251, 146, 60, 0.7), inset 0 0 16px rgba(255,255,255,0.75)';
                    } else {
                        t.progressRingEl.style.borderColor = '#10b981';
                        t.progressRingEl.style.background = 'radial-gradient(circle, rgba(255,255,255,0.55) 15%, rgba(56,189,248,0.3) 60%, rgba(16,185,129,0.6) 100%)';
                        t.progressRingEl.style.boxShadow = '0 0 28px rgba(16, 185, 129, 0.85), inset 0 0 20px rgba(255,255,255,0.85)';
                    }
                } else {
                    t.progressRingEl.style.opacity = '0';
                    t.progressRingEl.style.transform = 'translate(-50%, -50%) scale(1)';
                }
            } else {
                const pct = Math.min(100, (tapScore / config.tapGoal) * 100);
                gaugeBarEl.style.width = `${pct}%`;
                gaugeTextEl.textContent = `${tapScore} / ${config.tapGoal} てん`;
                targets.forEach(t => {
                    t.progressRingEl.style.opacity = '0';
                });
            }
        }

        playAreaEl.addEventListener('pointerdown', (e) => {
            if (isCleared || isWaitingNextLevel) return;
            sounds.init();
            e.preventDefault();

            activePointerId = e.pointerId;
            pointerX = e.clientX;
            pointerY = e.clientY;

            if (gameType === 'tap') {
                if (currentMode === 'challenge') {
                    for (let i = targets.length - 1; i >= 0; i--) {
                        if (isPointInTarget(e.clientX, e.clientY, targets[i])) {
                            handleTapModeHit(targets[i]);
                            break;
                        }
                    }
                } else {
                    targets.forEach(t => {
                        if (isPointInTarget(e.clientX, e.clientY, t)) {
                            handleTapModeHit(t);
                        }
                    });
                }
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (activePointerId === null || e.pointerId !== activePointerId) return;
            pointerX = e.clientX;
            pointerY = e.clientY;

            if (!isCleared && !isWaitingNextLevel && gameType === 'tap' && currentMode !== 'challenge') {
                targets.forEach(t => {
                    if (isPointerHittingTarget(t)) {
                        handleTapModeHit(t);
                    }
                });
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (e.pointerId !== activePointerId) return;
            activePointerId = null;
        });

        window.addEventListener('pointercancel', (e) => {
            if (e.pointerId !== activePointerId) return;
            activePointerId = null;
        });

        function closeModal() {
            document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        window.addEventListener('load', () => {
            initGame();
            requestAnimationFrame(updateLoop);
        });
    </script>
